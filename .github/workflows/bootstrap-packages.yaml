name: Bootstrap MeshBridge packages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Select publish to create the initial 1.0.0 images in the new GHCR namespace.
        required: true
        default: cancel
        type: choice
        options:
          - cancel
          - publish

permissions:
  contents: read

concurrency:
  group: meshbridge-package-bootstrap
  cancel-in-progress: false

jobs:
  validate-confirmation:
    name: Confirm initial package publication
    if: github.event.inputs.confirmation != 'publish'
    runs-on: ubuntu-24.04
    steps:
      - name: Explain how to start publication
        run: |
          echo "::error::This workflow is guarded. Select 'publish' in the confirmation menu, then run it again."
          exit 1

  approve-release:
    name: Approve initial package publication
    if: github.event.inputs.confirmation == 'publish'
    runs-on: ubuntu-24.04
    environment: meshbridge-release
    steps:
      - run: echo "Initial MeshBridge package publication approved."

  publish-beta:
    if: github.event.inputs.confirmation == 'publish'
    needs: approve-release
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/publish-app.yaml
    with:
      app: meshbridge_beta
      revision: ${{ github.sha }}
    secrets: inherit

  publish-alpha:
    if: github.event.inputs.confirmation == 'publish'
    needs: approve-release
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/publish-app.yaml
    with:
      app: meshbridge_alpha
      revision: ${{ github.sha }}
    secrets: inherit
