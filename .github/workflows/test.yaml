name: Validate MeshBridge

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
        with:
          fetch-depth: 2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, Node 24
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r meshbridge_beta/requirements-dev.txt
      - name: Validate MeshBridge branding and provenance
        run: python scripts/validate_meshbridge.py
      - name: Validate App metadata
        run: |
          python meshbridge_beta/scripts/validate_app.py
          python meshbridge_alpha/scripts/validate_app.py
      - name: Verify channel wrappers remain synchronized
        run: python scripts/verify_variants.py
      - name: Run unit tests
        run: |
          python -m pytest meshbridge_beta/tests
          python -m pytest meshbridge_alpha/tests
      - name: Validate shell syntax
        run: |
          sh -n meshbridge_beta/run.sh
          sh -n meshbridge_alpha/run.sh
      - name: Enforce Beta AppArmor startup path
        run: scripts/test_apparmor_runtime.sh meshbridge_beta
      - name: Enforce Alpha AppArmor startup path
        run: scripts/test_apparmor_runtime.sh meshbridge_alpha
      - name: Check for whitespace errors
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi
