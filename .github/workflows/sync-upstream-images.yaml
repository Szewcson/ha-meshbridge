name: Sync and publish MeshBridge upstream images

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: meshbridge-upstream-release-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Resolve, verify, and record upstream digests
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.changed.outputs.value }}
      revision: ${{ steps.revision.outputs.value }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, Node 24
        with:
          python-version: "3.12"
      - name: Install metadata validator dependency
        run: python -m pip install PyYAML
      - name: Resolve independent mutable Alpha and Beta channel digests
        run: python scripts/resolve_upstream_channels.py > "$RUNNER_TEMP/candidates.json"
      - id: changed
        name: Stop when every upstream digest is unchanged
        run: |
          if jq -e '[.channels[] | select(.changed)] | length > 0' "$RUNNER_TEMP/candidates.json" >/dev/null; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.value == 'true'
        name: Smoke-test newly discovered immutable upstream images
        run: sh scripts/smoke_upstream_candidate.sh "$RUNNER_TEMP/candidates.json" "$RUNNER_TEMP/versions.json"
      - if: steps.changed.outputs.value == 'true'
        name: Record validated immutable provenance
        run: python scripts/sync_upstream_metadata.py "$RUNNER_TEMP/candidates.json" "$RUNNER_TEMP/versions.json"
      - if: steps.changed.outputs.value == 'true'
        name: Validate generated metadata and both Apps
        run: |
          python scripts/validate_meshbridge.py
          python meshbridge_beta/scripts/validate_app.py
          python meshbridge_alpha/scripts/validate_app.py
          python scripts/verify_variants.py
      - if: steps.changed.outputs.value == 'true'
        name: Render release provenance
        run: python scripts/render_release_notes.py --changed-only >> "$GITHUB_STEP_SUMMARY"
      - if: steps.changed.outputs.value == 'true'
        name: Commit validated digest pins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- upstream.yaml meshbridge_beta meshbridge_alpha
          git commit -m "chore: sync MeshBridge upstream digest"
          git push
      - id: revision
        name: Select publication revision
        run: |
          if [ "${{ steps.changed.outputs.value }}" = true ]; then
            echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

  publish-beta:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/publish-app.yaml
    with:
      app: meshbridge_beta
      revision: ${{ needs.sync.outputs.revision }}
    secrets: inherit

  publish-alpha:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/publish-app.yaml
    with:
      app: meshbridge_alpha
      revision: ${{ needs.sync.outputs.revision }}
    secrets: inherit
