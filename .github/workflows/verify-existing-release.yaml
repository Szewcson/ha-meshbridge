name: Verify existing MeshBridge release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Published channel to verify.
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
      version:
        description: Immutable App version to verify, for example 1.0.2.
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Verify ${{ inputs.channel }} ${{ inputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate requested immutable release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be a semantic App version such as 1.0.2"
            exit 1
          fi
      - id: manifest
        name: Verify published multi-architecture manifest
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          reference="ghcr.io/szewcson/meshbridge-${CHANNEL}:${VERSION}"
          inspection="$(docker buildx imagetools inspect "$reference")"
          printf '%s\n' "$inspection"
          digest="$(awk '/^[[:space:]]*Digest:/ { print $2; exit }' <<< "$inspection")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Release manifest did not resolve to an OCI digest: $reference"
            exit 1
          fi
          docker buildx imagetools inspect --raw "$reference" | jq -e '
            (.manifests // []) as $manifests
            | ([ $manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") ] | length >= 1)
            and ([ $manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") ] | length >= 1)
          ' >/dev/null
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Verify GitHub Actions signature
        env:
          REFERENCE: ${{ steps.manifest.outputs.reference }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: >-
          cosign verify
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          --certificate-identity='https://github.com/Szewcson/ha-meshbridge/.github/workflows/publish-app.yaml@refs/heads/main'
          "${REFERENCE}@${DIGEST}"
